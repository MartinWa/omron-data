<div class="report-toolbar filters">
  <div class="report-toolbar-range">
    <span class="segmented" role="group" aria-label="Date range">
      {% for option in range_options %}
      {% if option.key == "custom" %}
      <button type="button" popovertarget="custom-range-popover" aria-expanded="false" class="segmented-item{% if option.current %} is-current{% endif %}"{% if option.current %} aria-current="true"{% endif %}>{% if option.current and range.key == "custom" %}{{ option.label }} · {{ range.label }}{% else %}{{ option.label }}{% endif %}</button>
      {% else %}
      <a class="segmented-item{% if option.current %} is-current{% endif %}" href="{% querystring range=option.key from=None to=None %}"{% if option.current %} aria-current="true"{% endif %}>{{ option.label }}</a>
      {% endif %}
      {% endfor %}
    </span>
  </div>
  <div class="filters-actions">
    <button class="btn btn-sm" type="button" data-print>Print</button>
  </div>
  <div id="custom-range-popover" popover class="range-popover">
    <form method="get" action="">
      <input type="hidden" name="range" value="custom">
      {% if query_metric %}<input type="hidden" name="metric" value="{{ query_metric }}">{% endif %}
      <div class="range-field">
        <label for="range-from">From</label>
        <input id="range-from" type="date" name="from" value="{{ custom_from }}">
      </div>
      <div class="range-field">
        <label for="range-to">To</label>
        <input id="range-to" type="date" name="to" value="{{ custom_to }}">
      </div>
      <button class="btn btn-primary btn-sm" type="submit">Apply</button>
    </form>
  </div>
</div>
