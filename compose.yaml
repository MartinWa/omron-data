services:
  web:
    image: "${OMRON_IMAGE:-omron-data:local}"
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - OMRON_SECRET_KEY
      - OMRON_ALLOWED_HOSTS
      - OMRON_DB_PATH=/app/data/omron.sqlite3
    volumes:
      - ./data:/app/data
    ports:
      - "${OMRON_PORT:-8010}:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
