name: Release image

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/martinwa/omron-data
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  publish:
    name: Publish the release image
    # A tag deletion reaches this workflow but has no image or release to publish.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # Create the GitHub Release for the tested tag.
      actions: read # Verify the successful CI jobs of the release commit.
      packages: write # Push the image, its index and the attestations to GHCR.
      id-token: write # Sign the provenance and SBOM attestations.
      attestations: write # Store the attestations for the published image.
    env:
      # The Git tag is the release version; pyproject.toml is never consulted.
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable tag on a tested main commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_CREATED: ${{ github.event.created }}
        run: python3 tools/publish_release.py --check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The version tag is the last thing this job writes, so a rerun of a failed
      # release sees an unpublished version and starts over. A version that is
      # already published means an earlier run got as far as promoting it; that
      # run only has to reconcile `latest` and finish the visibility check below.
      - name: Resolve an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          owner=${GITHUB_REPOSITORY%/*}
          package=${GITHUB_REPOSITORY#*/}
          published=false
          if gh api --paginate "users/$owner/packages/container/${package,,}/versions" \
            --jq '.[].metadata.container.tags[]' > "$RUNNER_TEMP/image-tags" 2> "$RUNNER_TEMP/registry-error"; then
            if grep -Fxq "$VERSION" "$RUNNER_TEMP/image-tags"; then
              published=true
            fi
          else
            # Before the first publication the package does not exist yet.
            grep -Fq '(HTTP 404)' "$RUNNER_TEMP/registry-error"
          fi
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = true ]; then
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ -n "$digest" ] || { echo "::error::Cannot read the digest of $IMAGE:$VERSION."; exit 1; }
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            printf 'Resuming: %s:%s is already published as %s, so the build and the attestations are skipped.\n' \
              "$IMAGE" "$VERSION" "$digest" >> "$GITHUB_STEP_SUMMARY"
            # A promotion writes the version tag and `latest` as two registry writes, so a
            # run that died between them leaves `latest` on the previous release while the
            # version tag already exists. Finish that second write here. Only the highest
            # published version may claim `latest`, so retrying an older run cannot move it
            # backwards.
            newest=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/image-tags" | sort -V | tail -n 1)
            [ -n "$newest" ] || { echo "::error::No released version tag in the package listing."; exit 1; }
            latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
            if [ "$latest" != "$digest" ]; then
              if [ "$VERSION" = "$newest" ]; then
                docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
                latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
                if [ "$latest" != "$digest" ]; then
                  echo "::error::$IMAGE:latest resolves to $latest, not to the attested $digest."
                  exit 1
                fi
                printf 'Re-pointed %s:latest at %s, left behind by a promotion interrupted between its two tag writes.\n' \
                  "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
              else
                printf 'Left %s:latest alone: %s is published, but %s is the highest version.\n' \
                  "$IMAGE" "$VERSION" "$newest" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
      - name: Build the amd64 image by digest
        id: amd64
        if: steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            OMRON_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=ci-production
          github-token: ""
      - name: Build the arm64 image by digest
        id: arm64
        if: steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            OMRON_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=ci-production
          github-token: ""
      - name: Check the amd64 image and generate its SBOM
        if: steps.existing.outputs.published != 'true'
        env:
          DIGEST: ${{ steps.amd64.outputs.digest }}
          SBOM: ${{ runner.temp }}/sbom-amd64.spdx.json
          PLATFORM: linux/amd64
        run: |
          bash tools/audit_image.sh "$IMAGE@$DIGEST" "$SBOM" "$PLATFORM"
          printf 'Audited %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the arm64 image and generate its SBOM
        if: steps.existing.outputs.published != 'true'
        env:
          DIGEST: ${{ steps.arm64.outputs.digest }}
          SBOM: ${{ runner.temp }}/sbom-arm64.spdx.json
          PLATFORM: linux/arm64
        run: |
          bash tools/audit_image.sh "$IMAGE@$DIGEST" "$SBOM" "$PLATFORM"
          printf 'Audited %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      # The index exists in the registry before it carries a release tag, because
      # an attestation has to point at something that is already there.
      - name: Publish the tested index under a candidate tag
        id: candidate
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          AMD64: ${{ steps.amd64.outputs.digest }}
          ARM64: ${{ steps.arm64.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION-candidate" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION-candidate" --format '{{json .Manifest.Digest}}' | tr -d '"')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Candidate index %s:%s-candidate is %s\n' "$IMAGE" "$VERSION" "$digest" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        if: steps.existing.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # One SBOM per platform manifest: the inventories differ, so a single
      # amd64 SBOM cannot describe the arm64 packages. Provenance covers the index.
      - name: Attest the amd64 SBOM
        if: steps.existing.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.amd64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the arm64 SBOM
        if: steps.existing.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.arm64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      # The attestations live in the registry rather than in the storage record,
      # so they are read back from there with the same command a consumer uses.
      - name: Verify the attestations of the candidate
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          AMD64: ${{ steps.amd64.outputs.digest }}
          ARM64: ${{ steps.arm64.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for digest in "$AMD64" "$ARM64"; do
            gh attestation verify "oci://$IMAGE@$digest" --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Verify the attestations of the resumed version
        if: steps.existing.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      # Only a signed and verified index becomes the release version, so the tag
      # never advertises an image whose attestations are missing or broken.
      # The candidate tag is not removed afterwards: in GHCR a version owns its
      # tags, so deleting the candidate would delete the release with it. It stays
      # as a second name for the same digest.
      - name: Promote the verified index to the version and latest
        id: push
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          promoted=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ "$promoted" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$VERSION resolves to $promoted, not to the attested $DIGEST."
            exit 1
          fi
          # The two tags are two registry writes, so verify both rather than assuming the
          # one command wrote them together.
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ "$latest" != "$DIGEST" ]; then
            echo "::error::$IMAGE:latest resolves to $latest, not to the attested $DIGEST."
            exit 1
          fi
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'Published %s:%s and %s:latest as %s\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" \
            >> "$GITHUB_STEP_SUMMARY"
      # GHCR creates a package private even for a public repository, and a
      # published image is worthless to a home lab if nobody can pull it. The
      # anonymous pull below fails the job whenever the two drift apart again.
      - name: Make the package public and verify an anonymous pull
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: |
          owner=${GITHUB_REPOSITORY%/*}
          package=${GITHUB_REPOSITORY#*/}
          api_path="users/${owner,,}/packages/container/${package,,}"
          if [ "$(gh api "$api_path" --jq .visibility 2>/dev/null)" != public ]; then
            gh api --method PATCH "$api_path" -f visibility=public >/dev/null 2>&1 || true
          fi
          anonymous=$(mktemp -d)
          trap 'rm -rf -- "$anonymous"' EXIT
          attempts=6
          while [ "$attempts" -gt 0 ]; do
            if DOCKER_CONFIG="$anonymous" docker pull "$IMAGE@$DIGEST"; then
              printf 'ghcr.io/%s is publicly pullable at %s\n' \
                "${GITHUB_REPOSITORY,,}" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            attempts=$((attempts - 1))
            sleep 10
          done
          echo "::error::ghcr.io/${GITHUB_REPOSITORY,,} is not pullable without credentials. Set the package visibility to public once in its settings so this job can keep it in step with the repository."
          exit 1
      - name: Create or publish the GitHub Release
        id: github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN does not trigger another release workflow, so the image
        # published above and the release written here cannot disagree.
        run: python3 tools/publish_release.py
